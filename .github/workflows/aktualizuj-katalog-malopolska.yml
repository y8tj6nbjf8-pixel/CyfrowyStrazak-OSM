name: OSM – aktualizacja katalogu OSP Małopolska
on:
  workflow_dispatch:
  schedule:
    - cron: '15 4 * * 0'
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Instalacja Osmium
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y osmium-tool
      - name: Pobieranie aktualnego wyciągu Geofabrik i granic powiatów
        run: |
          curl --fail --location --retry 3 --retry-delay 5 'https://download.geofabrik.de/europe/poland/malopolskie-latest.osm.pbf' -o malopolskie-latest.osm.pbf
          curl --fail --location --retry 3 --retry-delay 5 'https://raw.githubusercontent.com/waszkiewiczja/GeoJSON-Polska-Wojewodztwa-Powiaty-Gminy/main/powiaty.json' -o powiaty.json
      - name: Generator katalogu
        run: |
          python3 central-tools/generuj_katalog.py --boundaries powiaty.json --pbf malopolskie-latest.osm.pbf --out site/public_html/mapa-pro-katalog/data
      - name: Gotowy katalog do publikacji na hostingu
        uses: actions/upload-artifact@v4
        with:
          name: mapa-pro-katalog-malopolska
          path: site/public_html/mapa-pro-katalog/data/
          retention-days: 30
